name: Nightly notebooks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max on GH-hosted; job dies after this anyway
    
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          fi
          
          # ensure these are present even if requirements.txt is weird
          python -m pip install nbconvert ipykernel umap-learn
        
          python -m nbconvert \
            --to notebook \
            --execute notebooks/Benchmarking.ipynb \
            --output executed/Benchmarking-executed.ipynb \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.iopub_timeout=-1

      - name: Add repo root to PYTHONPATH
        run: |
          echo "GITHUB_WORKSPACE is: $GITHUB_WORKSPACE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

      - name: Install Jupyter kernel spec
        run: |
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Run all notebooks
        env:
            CARVE_N_JOBS: 2
            OMP_NUM_THREADS: 1
            MKL_NUM_THREADS: 1
        
        run: |
          set -e
          NOTEBOOKS=(
            # "notebooks/Benchmarking Dimensionality.ipynb"
            "notebooks/Benchmarking Non-Linear.ipynb"
            # "notebooks/Benchmarking Sample Size.ipynb"
            "notebooks/Benchmarking.ipynb"
          )

          mkdir -p executed

          for nb in "${NOTEBOOKS[@]}"; do
            base=$(basename "$nb")
            echo "Running $nb..."
            python -m nbconvert \
              --to notebook \
              --execute "$nb" \
              --output "executed/${base%.ipynb}-executed.ipynb" \
              --ExecutePreprocessor.timeout=3600
          done

      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: nightly-executed-notebooks
          path: executed/*.ipynb
