name: Nightly notebooks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install jupyter nbconvert
          fi

      - name: Run all notebooks
        env:
            CARVE_N_JOBS: 10
            OMP_NUM_THREADS: 1
            MKL_NUM_THREADS: 1
        
        run: |
          set -e
          NOTEBOOKS=(
            "notebooks/Benchmarking Dimensionality.ipynb"
            "notebooks/Benchmarking Non-Linear.ipynb"
            "notebooks/Benchmarking Sample Size.ipynb"
            "notebooks/Benchmarking.ipynb"
          )

          mkdir -p executed

          for nb in "${NOTEBOOKS[@]}"; do
            base=$(basename "$nb")
            echo "Running $nb..."
            jupyter nbconvert \
              --to notebook \
              --execute "$nb" \
              --output "executed/${base%.ipynb}-executed.ipynb" \
              --ExecutePreprocessor.timeout=3600
          done

      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: nightly-executed-notebooks
          path: executed/*.ipynb
