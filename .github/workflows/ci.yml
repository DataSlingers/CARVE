name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs the pinned ruff from the dev extra, so the linter version
      # lives in one place (pyproject.toml) rather than drifting here.
      - run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        resolution: [highest]
        include:
          # Oldest supported dependency set. This leg is not redundant: the
          # h5ad writer rejects the object-dtype columns a heterogeneous
          # estimator grid produces under pandas 2.3, while pandas 3's str
          # dtype hides the same bug entirely. Only this leg catches it.
          - python-version: "3.12"
            resolution: lowest-direct
    name: test (py${{ matrix.python-version }}, ${{ matrix.resolution }} deps)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # [graph] pulls igraph + leidenalg. Without it the Leiden/Louvain and
      # resolution-sweep tests skip, leaving that mode uncovered in CI.
      # [benchmarks] pulls pyarrow (parquet checkpoints) and scanpy (the
      # hECA and Klein loaders). tests/benchmarks/ runs here alongside the
      # carve suite and fails at import without them.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: >
          uv pip install --system
          --resolution ${{ matrix.resolution }}
          -e ".[dev,graph,benchmarks]"

      # umap-learn is an optional extra and its wheels lag new Python
      # releases, so only exercise the UMAP code path where it installs
      # cleanly. The suite skips those assertions when it is absent.
      - name: Install umap extra
        if: matrix.python-version == '3.12' && matrix.resolution == 'highest'
        run: uv pip install --system -e ".[umap]"

      - name: Run tests
        run: >
          pytest -v --tb=short
          --cov=carve --cov-report=term-missing
          --cov-fail-under=75
          --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}-${{ matrix.resolution }}
          path: report.xml
