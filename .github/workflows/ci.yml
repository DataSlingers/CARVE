name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Installs the pinned ruff from the dev extra, so the linter version
      # lives in one place (pyproject.toml) rather than drifting here.
      - run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  # The carve suite and the benchmarks suite are separate jobs so they run
  # concurrently: each is fit-heavy, and together they take about half an
  # hour on one runner. Coverage is measured on carve only, so it stays with
  # the carve job.
  #
  # [graph] pulls igraph + leidenalg. Without it the Leiden/Louvain and
  # resolution-sweep tests skip, leaving that mode uncovered in CI.
  # [benchmarks] pulls pyarrow (parquet checkpoints) and scanpy (the hECA
  # and Klein loaders); tests/benchmarks/ fails at import without them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,graph,umap]"

      - name: Run carve tests
        run: >
          pytest tests --ignore=tests/benchmarks
          -v --tb=short
          --cov=carve --cov-report=term-missing
          --cov-fail-under=75
          --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-carve
          path: report.xml

  test-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,graph,benchmarks]"

      - name: Run benchmarks tests
        run: >
          pytest tests/benchmarks
          -v --tb=short
          --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-benchmarks
          path: report.xml
