name: R CMD check

on:
  push:
    branches: [main]
    paths:
      - "carve-r/**"
      - ".github/workflows/r-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "carve-r/**"
      - ".github/workflows/r-ci.yml"

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The testthat suite skip_if_not_installed()s the heavy Bioconductor /
      # Seurat Suggests, so a missing Suggest should not fail the check.
      _R_CHECK_FORCE_SUGGESTS_: false

    defaults:
      run:
        working-directory: carve-r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr
          needs: check
          working-directory: carve-r

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: carve-r
          error-on: '"warning"'
          args: 'c("--no-manual")'
          upload-snapshots: true

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            flags = "r",
            token = Sys.getenv("CODECOV_TOKEN")
          )
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
