[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carve-validate"
version = "1.0.0"
description = "Cluster Analysis with Resampling for Validation and Exploration: stability- and generalizability-based clustering validation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kai Wycik", email = "kai.wycik@columbia.edu" },
]
keywords = [
  "clustering",
  "validation",
  "stability",
  "consensus",
  "scRNA-seq",
  "scikit-learn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0,<2.1",
  "scipy>=1.16,<1.17",
  "scikit-learn>=1.7.2,<1.8",
  "pandas>=2.2,<2.3",
  "joblib>=1.5,<1.6",
  "tqdm>=4.67,<5",
  "numba>=0.60,<0.61",
  "llvmlite>=0.43,<0.44",
  "umap-learn>=0.5.6",
  "pynndescent>=0.5.10,<0.6",
  "matplotlib>=3.9.4",
]

[project.urls]
Homepage = "https://github.com/DataSlingers/CARVE"
Repository = "https://github.com/DataSlingers/CARVE"
Issues = "https://github.com/DataSlingers/CARVE/issues"

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "pytest-cov",
]
notebooks = [
  "jupyterlab>=4.2,<5",
  "ipykernel>=6.29,<7",
  "ipywidgets>=8.1.7",
  "plotly>=6.3.0",
  "rpy2>=3.6.3",
  "pyreadr>=0.5.3",
  "scanpy>=1.11.4",
  "scikit-misc>=0.5.1",
  "anywidget>=0.9.18",
  "igraph>=1.0.0",
  "leidenalg>=0.11.0",
  "pyteomics>=4.7.5",
  "lxml>=6.0.2",
  "scvi>=0.6.8",
  "cmap>=0.7.0",
  "glasbey>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["carve.sim", "carve.sim.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["carve"]
omit = ["*/carve/sim/*"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "optuna>=4.8.0",
]
