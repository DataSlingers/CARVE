[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carve-validate"
version = "1.0.0"
description = "Cluster Analysis with Resampling for Validation and Exploration: stability- and generalizability-based clustering validation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kai Wycik", email = "kai.wycik@columbia.edu" },
]
keywords = [
  "clustering",
  "validation",
  "stability",
  "consensus",
  "scRNA-seq",
  "scikit-learn",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "anndata>=0.13",
  "joblib>=1.5",
  "matplotlib>=3.9.4",
  "numpy>=2.0",
  "pandas>=2.3",
  "scikit-learn>=1.7.2",
  "scipy>=1.16",
  "tqdm>=4.67",
]

[project.urls]
Documentation = "https://carve-validate.readthedocs.io/"
Homepage = "https://github.com/DataSlingers/CARVE"
Repository = "https://github.com/DataSlingers/CARVE"
Issues = "https://github.com/DataSlingers/CARVE/issues"

[project.optional-dependencies]
dev = [
  # Pinned: ruff changes its default rule set between minor releases, which
  # breaks CI on ruff's schedule rather than on ours. See [tool.ruff.lint].
  "ruff==0.16.4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  # test_ci_config.py parses the nightly workflow with yaml; it reached CI
  # only transitively (anndata -> zarr -> donfig -> pyyaml).
  "pyyaml>=6",
]
graph = [
  "igraph>=0.11",
  "leidenalg>=0.10",
]
umap = [
  "umap-learn>=0.5.6",
]
notebooks = [
  "jupyterlab>=4.2,<5",
  "ipykernel>=6.29,<7",
  "ipywidgets>=8.1.7",
  "plotly>=6.3.0",
  "rpy2>=3.6.3",
  "pyreadr>=0.5.3",
  "scanpy>=1.11.4",
  "scikit-misc>=0.5.1",
  "anywidget>=0.9.18",
  "igraph>=1.0.0",
  "leidenalg>=0.11.0",
  "pyteomics>=4.7.5",
  "lxml>=6.0.2",
  "scvi-tools>=1.0",
  "cmap>=0.7.0",
  "glasbey>=0.3.0",
]
benchmarks = [
  # 17.0.0 wheels ship a stray top-level "benchmarks" package (pyarrow's
  # own asv suite) that shadows src/benchmarks on sys.path. Fixed in 18.
  "pyarrow>=18",
  "scanpy>=1.11.4",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["carve.sim", "carve.sim.*", "benchmarks", "benchmarks.*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which expand
# between minor releases: 0.15 flagged 1 issue here, 0.16 flagged 45, with
# no change to our source. An explicit set keeps CI reproducible.
#   E4/E7/E9, F -- ruff's historical default (pyflakes + core pycodestyle)
#   I           -- import sorting
#   UP          -- pyupgrade, scoped by target-version
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
xfail_strict = true
filterwarnings = [
  "error",
  # umap-learn warns at import when tensorflow is absent; the carve CI job
  # installs the [umap] extra without tensorflow.
  "ignore:Tensorflow not installed:ImportWarning",
  # joblib.numpy_pickle sets .shape on arrays, deprecated in NumPy 2.5.
  # Hit by CARVE.save and CARVE.load. Drop once joblib stops doing it.
  "ignore:Setting the shape on a NumPy array:DeprecationWarning:joblib",
]
markers = [
  "requires_graph: needs the [graph] extra (igraph + leidenalg); skipped without it",
]

[tool.coverage.run]
source = ["carve"]
omit = ["*/carve/sim/*"]

[tool.coverage.report]
show_missing = true
