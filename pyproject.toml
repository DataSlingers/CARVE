[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carve"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "scipy>=1.10",
  "threadpoolctl>=3.1",
  "umap>=0.1.1",
  "tqdm>=4.67.1",
  "ipykernel>=6.30.1",
  "matplotlib>=3.9.4",
  "umap-learn>=0.5.6",
  "numba>=0.60",
  "llvmlite>=0.43,<0.44",
]

[tool.setuptools.packages.find]
where = ["src"]
