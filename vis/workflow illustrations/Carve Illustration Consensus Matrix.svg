<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CARVE output illustration: consensus matrix (transparent background, diagonal blocks)">
  <!-- panel outline -->
  <rect x="48" y="64" width="416" height="384" rx="28"
        fill="none" stroke="#EDEDED" stroke-opacity="0.18" stroke-width="6"/>

  <text x="76" y="118" fill="#EDEDED" opacity="0.85"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="20" font-weight="600">
    consensus matrix
  </text>

  <!-- matrix block (fits inside panel) -->
  <g transform="translate(96 128)">
    <rect x="0" y="0" width="320" height="320" rx="22"
          fill="none" stroke="#EDEDED" stroke-opacity="0.20" stroke-width="6"/>

    <!-- stylized cells (rounded squares) -->
    <g>
      <!-- diagonal block 1 (top-left) -->
      <g fill="#6EE7B7" fill-opacity="0.85">
        <!-- 4x4 -->
        <rect x="24" y="24" width="22" height="22" rx="7"/><rect x="50" y="24" width="22" height="22" rx="7"/>
        <rect x="76" y="24" width="22" height="22" rx="7"/><rect x="102" y="24" width="22" height="22" rx="7"/>
        <rect x="24" y="50" width="22" height="22" rx="7"/><rect x="50" y="50" width="22" height="22" rx="7"/>
        <rect x="76" y="50" width="22" height="22" rx="7"/><rect x="102" y="50" width="22" height="22" rx="7"/>
        <rect x="24" y="76" width="22" height="22" rx="7"/><rect x="50" y="76" width="22" height="22" rx="7"/>
        <rect x="76" y="76" width="22" height="22" rx="7"/><rect x="102" y="76" width="22" height="22" rx="7"/>
        <rect x="24" y="102" width="22" height="22" rx="7"/><rect x="50" y="102" width="22" height="22" rx="7"/>
        <rect x="76" y="102" width="22" height="22" rx="7"/><rect x="102" y="102" width="22" height="22" rx="7"/>
      </g>

      <!-- diagonal block 2 (center-ish) -->
      <g fill="#A78BFA" fill-opacity="0.85">
        <!-- 3x3, aligned on diagonal -->
        <rect x="144" y="144" width="22" height="22" rx="7"/><rect x="170" y="144" width="22" height="22" rx="7"/><rect x="196" y="144" width="22" height="22" rx="7"/>
        <rect x="144" y="170" width="22" height="22" rx="7"/><rect x="170" y="170" width="22" height="22" rx="7"/><rect x="196" y="170" width="22" height="22" rx="7"/>
        <rect x="144" y="196" width="22" height="22" rx="7"/><rect x="170" y="196" width="22" height="22" rx="7"/><rect x="196" y="196" width="22" height="22" rx="7"/>
      </g>

      <!-- diagonal block 3 (bottom-right) -->
      <g fill="#FBBF24" fill-opacity="0.85">
        <!-- 4x4, aligned on diagonal and leaving room for colorbar -->
        <rect x="200" y="200" width="22" height="22" rx="7"/><rect x="224" y="200" width="22" height="22" rx="7"/>
        <rect x="248" y="200" width="22" height="22" rx="7"/><rect x="272" y="200" width="22" height="22" rx="7"/>
        <rect x="200" y="224" width="22" height="22" rx="7"/><rect x="224" y="224" width="22" height="22" rx="7"/>
        <rect x="248" y="224" width="22" height="22" rx="7"/><rect x="272" y="224" width="22" height="22" rx="7"/>
        <rect x="200" y="248" width="22" height="22" rx="7"/><rect x="224" y="248" width="22" height="22" rx="7"/>
        <rect x="248" y="248" width="22" height="22" rx="7"/><rect x="272" y="248" width="22" height="22" rx="7"/>
        <rect x="200" y="272" width="22" height="22" rx="7"/><rect x="224" y="272" width="22" height="22" rx="7"/>
        <rect x="248" y="272" width="22" height="22" rx="7"/><rect x="272" y="272" width="22" height="22" rx="7"/>
      </g>

      <!-- off-diagonal faint cells -->
      <g fill="#EDEDED" fill-opacity="0.12">
        <rect x="144" y="24" width="22" height="22" rx="7"/><rect x="170" y="24" width="22" height="22" rx="7"/><rect x="196" y="24" width="22" height="22" rx="7"/>
        <rect x="24" y="144" width="22" height="22" rx="7"/><rect x="50" y="170" width="22" height="22" rx="7"/>
        <rect x="102" y="196" width="22" height="22" rx="7"/>
        <rect x="248" y="144" width="22" height="22" rx="7"/><rect x="272" y="170" width="22" height="22" rx="7"/>
        <rect x="144" y="272" width="22" height="22" rx="7"/><rect x="170" y="248" width="22" height="22" rx="7"/>
      </g>
    </g>

    <!-- block boundaries (aligned with blocks) -->
    <g stroke="#EDEDED" stroke-opacity="0.30" stroke-width="6" fill="none">
      <rect x="16" y="16" width="116" height="116" rx="16"/>
      <rect x="136" y="136" width="90" height="90" rx="16"/>
      <rect x="192" y="192" width="110" height="110" rx="16"/>
    </g>

    <!-- mini colorbar (bottom-left, not overlapping blocks) -->
    <g transform="translate(16 302)">
      <rect x="0" y="0" width="200" height="14" rx="7"
            fill="none" stroke="#EDEDED" stroke-opacity="0.20" stroke-width="4"/>
      <rect x="6" y="4" width="56" height="6" rx="3" fill="#EDEDED" fill-opacity="0.12"/>
      <rect x="72" y="4" width="56" height="6" rx="3" fill="#A78BFA" fill-opacity="0.55"/>
      <rect x="138" y="4" width="56" height="6" rx="3" fill="#6EE7B7" fill-opacity="0.85"/>
    </g>
  </g>
</svg>
