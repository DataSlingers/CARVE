  <!-- markers -->
  <g opacity="0.9">
    <g fill="#60A5FA">
      <circle cx="172" cy="316" r="8"/><circle cx="224" cy="304" r="8"/><circle cx="276" cy="318" r="8"/>
    </g>
    <g fill="#A78BFA">
      <circle cx="224" cy="330" r="8"/><circle cx="276" cy="308" r="8"/><circle cx="328" cy="300" r="8"/>
    </g>
    <g fill="#FBBF24">
      <circle cx="224" cy="286" r="8"/><circle cx="276" cy="294" r="8"/><circle cx="328" cy="310" r="8"/>
    </g>
  </g>

  <!-- winning peak star -->
  <g transform="translate(328 246)">
    <path d="M0 -22 L6 -7 L22 -6 L9 4 L13 20 L0 12 L-13 20 L-9 4 L-22 -6 L-6 -7 Z"
