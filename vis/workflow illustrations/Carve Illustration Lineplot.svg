<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CARVE output illustration: multi-line score over k (transparent background)">
  <!-- transparent background: no backdrop rectangles -->
  <!-- subtle panel outline (no fill) -->
  <rect x="48" y="64" width="416" height="384" rx="28"
        fill="none" stroke="#EDEDED" stroke-opacity="0.18" stroke-width="6"/>

  <!-- axes -->
  <g stroke="#EDEDED" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M120 388 L120 168"/>
    <path d="M120 388 L412 388"/>
  </g>

  <!-- x ticks -->
  <g stroke="#EDEDED" stroke-width="6" stroke-linecap="round" opacity="0.35">
    <path d="M172 388 L172 402"/>
    <path d="M224 388 L224 402"/>
    <path d="M276 388 L276 402"/>
    <path d="M328 388 L328 402"/>
    <path d="M380 388 L380 402"/>
  </g>

  <!-- lines -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 340 L172 316 L224 304 L276 318 L328 346 L380 368 L412 380"
          stroke="#60A5FA" stroke-width="10" opacity="0.9"/>
    <path d="M120 358 L172 346 L224 330 L276 308 L328 300 L380 316 L412 342"
